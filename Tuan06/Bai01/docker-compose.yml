services:
  db:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_PASSWORD: Theanh123 
      POSTGRES_DB: mydb 
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  app:
    build: .
    container_name: node-app
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: Theanh123 
      DB_NAME: mydb

volumes:
  pgdata:
