spring:
  application:
    name: user-service
  profiles:
    active: dev


  # Bổ sung đoạn này vào:
  datasource:
    url: jdbc:postgresql://localhost:5433/user_db?options=-c%20timezone=UTC
    username: root
    password: Theanh123
    driver-class-name: org.postgresql.Driver

  jwt:
    secret: YourSuperSecretKeyForJWTThatIsVeryLongAndSecureYourSuperSecretKey
    expiration: 3600000 # 1h
    refresh-expiration: 604800000 # 7 ngày
